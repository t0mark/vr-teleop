# compose 프로젝트 이름 고정
name: rby1-web-teleop

services:
  teleop:
    container_name: airlab_hw_teleop
    image: t0mark251/rby1-web-teleop:latest
    build:
      context: .
      dockerfile: Dockerfile
      # Manus SDK Python 패키지 (MANUS 배포 SDK를 reference/manusSDK에 풀어 둔다 — README 참고)
      additional_contexts:
        manus_sdk: ../reference/manusSDK/Python
    # 호스트 네트워크 사용 (로봇 gRPC·Quest 직결·WebRTC ICE)
    network_mode: host
    volumes:
      # 저장소 루트 → /workspace (RBY1 URDF·메시는 assets/rby1a로 함께 마운트)
      - ..:/workspace
      # 장치 노드 전체 노출 (D455 UVC 노드·USB 장치, 열 수 있는 장치는 아래 cgroup 규칙으로 제한)
      - /dev:/dev
    # USB(189)·V4L(81) 문자 장치만 접근 허용 (D455, Manus 동글)
    device_cgroup_rules:
      - "c 189:* rmw"
      - "c 81:* rmw"
    # 비정상 종료·재부팅 시 자동 재기동 (수동 stop한 경우는 제외)
    restart: unless-stopped
    environment:
      # 초기 실행 모드 (기본 dev, 호스트별 값은 docker/.env에서 지정)
      - TELEOP_MODE=${TELEOP_MODE:-dev}
    # 서버 실행 (기동 실패 시 restart 정책으로 재시도, 서버 로그는 logs/web_api.log, 콘솔 출력은 docker logs)
    command: python -m teleop.main
    # docker stop의 SIGTERM 후 종료 정리 대기 시간
    stop_grace_period: 30s
    # docker logs 크기 제한
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
