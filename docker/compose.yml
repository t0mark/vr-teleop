# 프로젝트 이름 고정 (폴더명 기반 자동 이름이 타 프로젝트와 겹치는 것 방지)
name: rby1-web-teleop

services:
  teleop:
    container_name: airlab_hw_teleop
    image: t0mark251/rby1-web-teleop:latest
    build:
      context: .
      dockerfile: Dockerfile
    # 로봇 gRPC(192.168.30.1)·Quest 직결·WebRTC ICE를 단순화하기 위해 호스트 네트워크 사용
    network_mode: host
    volumes:
      # 저장소 루트 → /workspace (RBY1 URDF·메시는 assets/rby1a로 함께 마운트)
      - ..:/workspace
      # D455 접근: pyrealsense2 wheel은 V4L2 백엔드라 /dev/video*(UVC 노드)가 필요하고,
      # 노드 번호가 재연결 때마다 바뀌므로 /dev 전체를 노출한다 (열 수 있는 장치는 아래 cgroup 규칙으로 제한)
      - /dev:/dev
    # USB(189)·V4L(81)·USB 시리얼(188, 그리퍼 Dynamixel 버스 /dev/rby1_gripper) 문자 장치만 접근 허용
    # (privileged 대신 최소 권한)
    device_cgroup_rules:
      - "c 189:* rmw"
      - "c 81:* rmw"
      - "c 188:* rmw"
    # dockerd가 부팅 시 자동 기동되도록 등록되어 있어, 이 정책만으로 재부팅 후 컨테이너가 자동 복귀한다.
    # 수동으로 stop한 경우에는 재부팅해도 다시 켜지지 않는다 (always와 차이).
    restart: unless-stopped
    environment:
      # 저장소 compose.yml에는 안전한 기본값(dev)만 두고, 호스트별 실제 값은
      # docker/.env(gitignore, 미포함)에서 오버라이드한다. 이 PC(로봇 내장 PC)는 .env에서 deploy로 고정.
      - TELEOP_MODE=${TELEOP_MODE:-dev}
    # 컨테이너 기동 = 서비스 기동. 초기 모드 접속 실패는 main.py가 SystemExit하며,
    # restart 정책에 의해 재시도된다 (로봇 gRPC·D455가 늦게 준비되는 부팅 경합 상황에 대한 자연스러운 재시도).
    command: >
      bash -c "mkdir -p logs && exec python -m teleop.main >> logs/web_api.log 2>&1"
